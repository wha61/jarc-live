<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JARC live demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0d12;
      color: #f4f1ea;
      font-family: sans-serif;
      text-align: center;
      padding: 24px;
    }
    p { color: #9a9588; max-width: 28rem; line-height: 1.5; }
  </style>
</head>
<body>
  <p id="msg">Opening the live demo…</p>
  <script>
    fetch("current.json?ts=" + Date.now(), { cache: "no-store" })
      .then((r) => r.json())
      .then((d) => {
        if (d && d.url) {
          location.replace(d.url);
        } else {
          document.getElementById("msg").textContent =
            "Demo is offline. Please try again during the poster session.";
        }
      })
      .catch(() => {
        document.getElementById("msg").textContent =
          "Demo is offline. Please try again during the poster session.";
      });
  </script>
</body>
</html>
